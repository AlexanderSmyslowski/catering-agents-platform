services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-catering_agents}
      POSTGRES_USER: ${POSTGRES_USER:-catering}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  intake:
    build:
      context: ..
      dockerfile: platform-infra/docker/Dockerfile.runtime
    restart: unless-stopped
    environment:
      CATERING_DATABASE_URL: postgresql://${POSTGRES_USER:-catering}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-catering_agents}
      CATERING_DEFAULT_BUSINESS_ID: ${CATERING_DEFAULT_BUSINESS_ID:-local}
      CATERING_TRUSTED_ACTOR_SECRET: ${CATERING_TRUSTED_ACTOR_SECRET:?Set CATERING_TRUSTED_ACTOR_SECRET}
      INTAKE_PORT: 3101
      INTAKE_HOST: 0.0.0.0
    depends_on:
      postgres:
        condition: service_healthy
    command: ["npm", "run", "dev:intake"]

  offer:
    build:
      context: ..
      dockerfile: platform-infra/docker/Dockerfile.runtime
    restart: unless-stopped
    environment:
      CATERING_DATABASE_URL: postgresql://${POSTGRES_USER:-catering}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-catering_agents}
      CATERING_DEFAULT_BUSINESS_ID: ${CATERING_DEFAULT_BUSINESS_ID:-local}
      CATERING_TRUSTED_ACTOR_SECRET: ${CATERING_TRUSTED_ACTOR_SECRET:?Set CATERING_TRUSTED_ACTOR_SECRET}
      CATERING_INTAKE_SERVICE_URL: http://intake:3101
      OFFER_PORT: 3102
      OFFER_HOST: 0.0.0.0
    depends_on:
      postgres:
        condition: service_healthy
      intake:
        condition: service_started
    command: ["npm", "run", "dev:offer"]

  production:
    build:
      context: ..
      dockerfile: platform-infra/docker/Dockerfile.runtime
    restart: unless-stopped
    environment:
      CATERING_DATABASE_URL: postgresql://${POSTGRES_USER:-catering}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-catering_agents}
      CATERING_DEFAULT_BUSINESS_ID: ${CATERING_DEFAULT_BUSINESS_ID:-local}
      CATERING_TRUSTED_ACTOR_SECRET: ${CATERING_TRUSTED_ACTOR_SECRET:?Set CATERING_TRUSTED_ACTOR_SECRET}
      CATERING_OFFER_SERVICE_URL: http://offer:3102
      CATERING_INTAKE_SERVICE_URL: http://intake:3101
      PRODUCTION_PORT: 3103
      PRODUCTION_HOST: 0.0.0.0
    depends_on:
      postgres:
        condition: service_healthy
      intake:
        condition: service_started
    command: ["npm", "run", "dev:production"]

  exports:
    build:
      context: ..
      dockerfile: platform-infra/docker/Dockerfile.runtime
    restart: unless-stopped
    environment:
      CATERING_DATABASE_URL: postgresql://${POSTGRES_USER:-catering}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-catering_agents}
      CATERING_DEFAULT_BUSINESS_ID: ${CATERING_DEFAULT_BUSINESS_ID:-local}
      CATERING_TRUSTED_ACTOR_SECRET: ${CATERING_TRUSTED_ACTOR_SECRET:?Set CATERING_TRUSTED_ACTOR_SECRET}
      PRINT_EXPORT_PORT: 3104
      PRINT_EXPORT_HOST: 0.0.0.0
    depends_on:
      postgres:
        condition: service_healthy
    command: ["npm", "run", "dev:exports"]

  web:
    build:
      context: ..
      dockerfile: platform-infra/docker/Dockerfile.web
    restart: unless-stopped
    depends_on:
      - intake
      - offer
      - production
      - exports
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
    environment:
      CATERING_SITE_ADDRESS: ${CATERING_SITE_ADDRESS:-:80}
      CATERING_DEFAULT_BUSINESS_ID: ${CATERING_DEFAULT_BUSINESS_ID:-local}
      CADDY_EMAIL: ${CADDY_EMAIL:-ops@example.com}
      CATERING_BASIC_AUTH_USER: ${CATERING_BASIC_AUTH_USER:?Set CATERING_BASIC_AUTH_USER}
      CATERING_BASIC_AUTH_PASSWORD_HASH: ${CATERING_BASIC_AUTH_PASSWORD_HASH:?Set CATERING_BASIC_AUTH_PASSWORD_HASH}
      CATERING_TRUSTED_ACTOR_SECRET: ${CATERING_TRUSTED_ACTOR_SECRET:?Set CATERING_TRUSTED_ACTOR_SECRET}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - "./sites:/etc/caddy/sites:ro"
    networks:
      - default
      - zeiterfassung_default

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  zeiterfassung_default:
    external: true
    name: zeiterfassung_default
