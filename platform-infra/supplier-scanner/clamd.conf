# Dedicated local scanner for bounded supplier attachments.
Foreground yes
DatabaseDirectory /var/lib/clamav
LocalSocket /run/catering-supplier-scanner/clamd.sock
LocalSocketMode 600
FixStaleSocket no
StreamMaxLength 5M
MaxFileSize 5M
MaxScanSize 32M
MaxRecursion 16
MaxFiles 1000
MaxScanTime 30000
AlertExceedsMax yes
AlertEncrypted yes
AlertBrokenExecutables yes
AlertBrokenMedia yes
ScanArchive yes
MaxThreads 1
MaxQueue 2
SelfCheck 600
TemporaryDirectory /tmp
