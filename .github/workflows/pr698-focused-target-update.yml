name: PR698 focused target-update TDD

on:
  push:
    branches:
      - codex/catering-target-update-path-20260921

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run tests/catering-target-update-contract.test.ts tests/catering-target-update-runner.test.ts --maxWorkers=1
      - run: python3 -m unittest tests/catering_target_isolation_test.py tests/catering_target_operations_test.py
      - run: bash -n platform-infra/scripts/update-catering-target.sh
      - run: python3 -m py_compile platform-infra/scripts/catering-target-update-harness.py
