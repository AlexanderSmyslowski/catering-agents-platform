name: PR712 ownership proof

on:
  push:
    branches:
      - ops/pr712-runtime-identity-proof-ownership-20260925

permissions:
  contents: read

jobs:
  targeted-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact proof head
        uses: actions/checkout@v5
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Bind proof to PR 712 head
        env:
          EXPECTED_PARENT: 53bb7db3113794aa8f2e0e24cddcac338afb3762
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test -z "$(git diff --name-only HEAD^ HEAD -- . ':!.github/workflows/pr712-ownership-proof.yml')"
          printf 'PR712_OWNERSHIP_PROOF_BINDING_OK parent=%s\n' "$EXPECTED_PARENT"

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Syntax check updater
        run: bash -n platform-infra/scripts/catering-target-production-update.sh

      - name: Run targeted runtime identity test
        run: npx vitest run tests/catering-target-runtime-identity-fix.test.ts --maxWorkers=1

      - name: Proof marker
        run: printf 'PR712_OWNERSHIP_PROOF_OK\n'
