name: PR 685 P2 RED proof

on:
  push:
    branches:
      - codex/operator-readout-container-fix-20260903
    paths:
      - ".github/workflows/pr685-p2-red-proof.yml"

permissions:
  contents: read

jobs:
  red-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Require the four new storage contracts to fail before implementation
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/pr685-p2-red.log"
          set +e
          npx vitest run tests/catering-production-operator-readout-contract.test.ts \
            --maxWorkers=1 --reporter=verbose 2>&1 | tee "$output"
          test_rc=${PIPESTATUS[0]}
          set -e
          test "$test_rc" -ne 0
          grep -F "recognizes DATABASE_URL as the runtime PostgreSQL fallback" "$output"
          grep -F "maps the default file data root from the container working directory" "$output"
          grep -F "marks an unmounted default file data root as a partial collection" "$output"
          grep -F "uses PostgreSQL precedence when a file root is also configured" "$output"
          grep -F "4 failed" "$output"
          printf 'RED_PROOF expected_storage_contract_failures=4\n'
