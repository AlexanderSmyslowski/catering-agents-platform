name: PR699 preflight TDD

on:
  push:
    branches:
      - codex/catering-target-preflight-only-20260922

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run tests/catering-target-preflight-workflow.test.ts --maxWorkers=1
