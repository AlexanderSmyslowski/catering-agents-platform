name: Deploy edge production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shared-edge-production-deploy
  cancel-in-progress: false

jobs:
  deploy-edge:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20

    steps:
      - name: Checkout exact dispatch commit
        uses: actions/checkout@v5

      - name: Configure SSH
        env:
          HETZNER_SSH_PRIVATE_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
          HETZNER_SSH_KNOWN_HOSTS: ${{ secrets.HETZNER_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$HETZNER_SSH_PRIVATE_KEY"
          test -n "$HETZNER_SSH_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$HETZNER_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$HETZNER_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Validate edge deployment inputs
        env:
          DEPLOY_HOST: ${{ secrets.HETZNER_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.HETZNER_DEPLOY_USER }}
          CATERING_SMOKE_URL: https://catering.the-one.catering
          CATERING_SMOKE_BASIC_AUTH_USER: ${{ secrets.SMOKE_BASIC_AUTH_USER }}
          CATERING_SMOKE_BASIC_AUTH_PASSWORD: ${{ secrets.SMOKE_BASIC_AUTH_PASSWORD }}
          EDGE_MODE: rehearsal
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test "$CATERING_SMOKE_URL" = "https://catering.the-one.catering"
          test -n "$CATERING_SMOKE_BASIC_AUTH_USER"
          test -n "$CATERING_SMOKE_BASIC_AUTH_PASSWORD"
          test "$EDGE_MODE" = rehearsal

      - name: Bootstrap protected edge env if missing
        env:
          DEPLOY_HOST: ${{ secrets.HETZNER_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.HETZNER_DEPLOY_USER }}
        run: |
          set -euo pipefail
          remote="${DEPLOY_USER}@${DEPLOY_HOST}"
          if ssh "$remote" "sudo test -f /opt/shared-edge/.env"; then
            echo "Protected edge .env already present; leaving bootstrap state unchanged."
          else
            remote_tmp="/tmp/shared-edge.env.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
            scp edge-infra/.env.example "$remote:$remote_tmp"
            ssh "$remote" bash -s -- "$remote_tmp" <<'REMOTE_SCRIPT'
          set -euo pipefail
          tmp="$1"
          edge_path="/opt/shared-edge"
          pending="${edge_path}/.env.pending.$$"
          cleanup() {
            rm -f "$tmp"
            if [[ -n "${pending:-}" ]]; then
              sudo rm -f "$pending"
            fi
          }
          trap cleanup EXIT

          if sudo test -f "${edge_path}/.env"; then
            echo "Protected edge .env appeared concurrently; leaving it unchanged."
            exit 0
          fi

          deploy_uid="$(id -u)"
          deploy_gid="$(id -g)"
          sudo install -d -m 0755 "$edge_path"
          sudo install -o "$deploy_uid" -g "$deploy_gid" -m 0600 "$tmp" "$pending"
          cmp -s "$tmp" "$pending"
          test "$(stat -c '%a %u %g' "$pending")" = "600 ${deploy_uid} ${deploy_gid}"
          sudo mv -f "$pending" "${edge_path}/.env"
          pending=""
          test "$(stat -c '%a %u %g' "${edge_path}/.env")" = "600 ${deploy_uid} ${deploy_gid}"
          REMOTE_SCRIPT
            echo "Protected edge .env bootstrapped atomically from edge-only rehearsal defaults."
          fi

      - name: Deploy exact edge commit
        env:
          DEPLOY_HOST: ${{ secrets.HETZNER_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.HETZNER_DEPLOY_USER }}
          DEPLOY_RSYNC_PATH: sudo rsync
          EDGE_DEPLOY_PATH: /opt/shared-edge
          EDGE_ROLLBACK_ROOT: /opt/shared-edge-rollbacks
          EDGE_DEPLOY_COMMIT_SHA: ${{ github.sha }}
          EDGE_MODE: rehearsal
          CATERING_SMOKE_URL: https://catering.the-one.catering
          CATERING_SMOKE_BASIC_AUTH_USER: ${{ secrets.SMOKE_BASIC_AUTH_USER }}
          CATERING_SMOKE_BASIC_AUTH_PASSWORD: ${{ secrets.SMOKE_BASIC_AUTH_PASSWORD }}
          ZEITERFASSUNG_SMOKE_URL: https://zeit.the-one.catering
          EVENTOS_SMOKE_URL: https://eventos.commcats.de
        run: bash edge-infra/scripts/deploy-hetzner.sh
