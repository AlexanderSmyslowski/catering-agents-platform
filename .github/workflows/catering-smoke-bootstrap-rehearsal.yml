name: Catering smoke bootstrap rehearsal

on:
  push:
    branches:
      - ops/catering-smoke-bootstrap-rehearsal-20260924
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  smoke-bootstrap-rehearsal:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE_COMMIT: 5b2c77089e7fd9051b4a55e38240cd69d6e9ed99
      SYNTHETIC_PIN: "482731"
      SYNTHETIC_LOGIN_CODE: release-smoke-ci
      SYNTHETIC_BUSINESS_ID: the-one
      SYNTHETIC_POSTGRES_PASSWORD: synthetic-bootstrap-only

    steps:
      - name: Checkout exact product source
        uses: actions/checkout@v5
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          path: source
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact source binding
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_COMMIT"
          test -z "$(git -C source status --porcelain)"
          remote_main="$(git -C source ls-remote origin refs/heads/main | awk 'NR == 1 {print $1}')"
          test "$remote_main" = "$SOURCE_COMMIT"
          test -x source/scripts/manage-catering-user
          grep -F 'exec "${tsx_runner}" "${repository_root}/scripts/manage-catering-user.ts" "$@"' source/scripts/manage-catering-user

      - name: Build exact runtime image
        run: |
          set -euo pipefail
          docker build             --tag "catering-bootstrap-rehearsal:$SOURCE_COMMIT"             --file source/platform-infra/docker/Dockerfile.runtime             source
          test -z "$(git -C source status --porcelain --untracked-files=all)"

      - name: Start isolated PostgreSQL 17
        run: |
          set -euo pipefail
          network="catering-bootstrap-rehearsal-${GITHUB_RUN_ID}"
          postgres="catering-bootstrap-postgres-${GITHUB_RUN_ID}"
          printf '%s\n' "$network" > "$RUNNER_TEMP/bootstrap-network"
          printf '%s\n' "$postgres" > "$RUNNER_TEMP/bootstrap-postgres"

          docker network create "$network" >/dev/null
          docker run -d --rm             --name "$postgres"             --network "$network"             --network-alias postgres             -e POSTGRES_DB=catering_agents             -e POSTGRES_USER=catering             -e POSTGRES_PASSWORD="$SYNTHETIC_POSTGRES_PASSWORD"             postgres:17.9-alpine >/dev/null

          for attempt in $(seq 1 60); do
            if docker exec "$postgres" pg_isready -U catering -d catering_agents >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          echo "PostgreSQL rehearsal did not become ready" >&2
          exit 1

      - name: Inspect runtime TTY prerequisites
        run: |
          set -euo pipefail
          image="catering-bootstrap-rehearsal:$SOURCE_COMMIT"
          docker run --rm --pull never "$image" /bin/sh -eu -c '
            test -x ./node_modules/.bin/tsx
            test -x /bin/busybox
            if command -v stty >/dev/null 2>&1; then
              printf "RUNTIME_TTY_PREREQ stty=command tsx=present\n"
            elif /bin/busybox --list | grep -qx stty; then
              printf "RUNTIME_TTY_PREREQ stty=busybox tsx=present\n"
            else
              printf "RUNTIME_TTY_PREREQ stty=missing tsx=present\n"
            fi
          '

      - name: Run real TTY admin create against PostgreSQL
        run: |
          set -euo pipefail
          command -v script >/dev/null
          script --help | grep -F -- '--echo' >/dev/null

          network="$(cat "$RUNNER_TEMP/bootstrap-network")"
          image="catering-bootstrap-rehearsal:$SOURCE_COMMIT"
          output="$RUNNER_TEMP/bootstrap-tty-output.txt"
          stderr="$RUNNER_TEMP/bootstrap-tty-stderr.txt"

          database_url="postgresql://catering:$SYNTHETIC_POSTGRES_PASSWORD@postgres:5432/catering_agents"
          command_string="docker run --rm -it --pull never --network '$network' -e CATERING_DATABASE_URL='$database_url' -e CATERING_DEFAULT_BUSINESS_ID='$SYNTHETIC_BUSINESS_ID' '$image' ./node_modules/.bin/tsx scripts/manage-catering-user.ts create --login-code '$SYNTHETIC_LOGIN_CODE' --display-name 'Release Smoke' --role read_only_operator"

          set +e
          printf '%s\n' "$SYNTHETIC_PIN" | script -q -e -E never -c "$command_string" /dev/null >"$output" 2>"$stderr"
          rc=$?
          set -e

          stderr_nonempty=false
          pin_echo=false
          success_marker=false
          display_marker=false
          role_marker=false
          active_marker=false
          error_marker=false

          test -s "$stderr" && stderr_nonempty=true
          grep -Fq -- "$SYNTHETIC_PIN" "$output" && pin_echo=true
          grep -Fq -- '"status":"success"' "$output" && success_marker=true
          grep -Fq -- '"displayName":"Release Smoke"' "$output" && display_marker=true
          grep -Fq -- '"role":"read_only_operator"' "$output" && role_marker=true
          grep -Fq -- '"active":true' "$output" && active_marker=true
          if grep -Fq -- '"status":"error"' "$output" || grep -Fq -- '"status":"error"' "$stderr"; then
            error_marker=true
          fi

          postgres="$(cat "$RUNNER_TEMP/bootstrap-postgres")"
          records_table="$(docker exec "$postgres" psql --no-psqlrc --no-password -U catering -d catering_agents --tuples-only --no-align --command="SELECT COALESCE(to_regclass('public.catering_business_records')::text,'')" | tr -d '[:space:]')"
          if [[ "$records_table" == "catering_business_records" ]]; then
            auth_users="$(docker exec "$postgres" psql --no-psqlrc --no-password -U catering -d catering_agents --tuples-only --no-align --command="SELECT count(*) FROM catering_business_records WHERE collection_name='auth/users'" | tr -d '[:space:]')"
          else
            auth_users=0
          fi

          printf 'BOOTSTRAP_REHEARSAL_DIAG rc=%s stderr_nonempty=%s pin_echo=%s success_marker=%s display_marker=%s role_marker=%s active_marker=%s error_marker=%s records_table=%s auth_users=%s\n' \
            "$rc" "$stderr_nonempty" "$pin_echo" "$success_marker" "$display_marker" "$role_marker" "$active_marker" "$error_marker" "${records_table:-missing}" "$auth_users"

          test "$rc" -eq 0
          test "$stderr_nonempty" = false
          test "$pin_echo" = false
          test "$success_marker" = true
          test "$display_marker" = true
          test "$role_marker" = true
          test "$active_marker" = true
          test "$error_marker" = false
          test "$auth_users" = 1

      - name: Verify PostgreSQL record and schema
        run: |
          set -euo pipefail
          postgres="$(cat "$RUNNER_TEMP/bootstrap-postgres")"

          schema_version="$(docker exec "$postgres"             psql --no-psqlrc --no-password -U catering -d catering_agents             --tuples-only --no-align             --command="SELECT version_number FROM catering_schema_migrations WHERE unit_name='catering_business_records'"             | tr -d '[:space:]')"
          printf 'REHEARSAL_DB schema_version=%s\n' "$schema_version"
          test "$schema_version" = "3"

          count="$(docker exec "$postgres"             psql --no-psqlrc --no-password -U catering -d catering_agents             --tuples-only --no-align             --command="SELECT count(*) FROM catering_business_records WHERE collection_name='auth/users'"             | tr -d '[:space:]')"
          printf 'REHEARSAL_DB auth_users=%s\n' "$count"
          test "$count" = "1"

          verdict="$(
            docker exec -i "$postgres"               psql --no-psqlrc --no-password -U catering -d catering_agents               --tuples-only --no-align <<'SQL'             | tr -d '[:space:]'
          SELECT CASE
            WHEN count(*) = 1
             AND bool_and(payload->>'schemaVersion' = '1.0')
             AND bool_and(payload->>'displayName' = 'Release Smoke')
             AND bool_and(payload->>'role' = 'read_only_operator')
             AND bool_and(payload->>'active' = 'true')
             AND bool_and(payload->>'businessId' = business_id)
             AND bool_and(payload->>'authEpoch' = '0')
             AND bool_and(payload->>'failedLoginCount' = '0')
             AND bool_and(payload->>'version' = '0')
             AND bool_and(payload->>'loginCodeCanonical' = 'release-smoke-ci')
             AND bool_and((payload->>'pinHash') ~ '^scrypt\$16384\$8\$1\$[0-9a-f]{32}\$[0-9a-f]{64}$')
            THEN 'ok'
            ELSE 'fail'
          END
          FROM catering_business_records
          WHERE collection_name = 'auth/users';
          SQL
          )"
          printf 'REHEARSAL_DB verdict=%s\n' "$verdict"
          test "$verdict" = "ok"

          printf 'CATERING_SMOKE_BOOTSTRAP_REHEARSAL_OK source_commit=%s schema_version=3 auth_users=1 role=read_only_operator tty=true postgres=true\n' "$SOURCE_COMMIT"

      - name: Cleanup rehearsal
        if: always()
        run: |
          set +e
          if [[ -f "$RUNNER_TEMP/bootstrap-postgres" ]]; then
            docker rm -f "$(cat "$RUNNER_TEMP/bootstrap-postgres")" >/dev/null 2>&1
          fi
          if [[ -f "$RUNNER_TEMP/bootstrap-network" ]]; then
            docker network rm "$(cat "$RUNNER_TEMP/bootstrap-network")" >/dev/null 2>&1
          fi
