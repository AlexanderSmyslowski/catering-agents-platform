name: Deploy Catering web listener

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catering-production-deploy
  cancel-in-progress: false

jobs:
  deploy-web-listener:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20

    steps:
      - name: Checkout exact dispatch commit
        uses: actions/checkout@v5

      - name: Configure SSH
        env:
          HETZNER_SSH_PRIVATE_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
          HETZNER_SSH_KNOWN_HOSTS: ${{ secrets.HETZNER_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$HETZNER_SSH_PRIVATE_KEY"
          test -n "$HETZNER_SSH_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$HETZNER_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$HETZNER_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Validate targeted deployment secrets
        env:
          DEPLOY_HOST: ${{ secrets.HETZNER_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.HETZNER_DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.HETZNER_DEPLOY_PATH }}
          SMOKE_BASIC_AUTH_USER: ${{ secrets.SMOKE_BASIC_AUTH_USER }}
          SMOKE_BASIC_AUTH_PASSWORD: ${{ secrets.SMOKE_BASIC_AUTH_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_PATH"
          test -n "$SMOKE_BASIC_AUTH_USER"
          test -n "$SMOKE_BASIC_AUTH_PASSWORD"

      - name: Deploy exact web-listener commit
        env:
          DEPLOY_HOST: ${{ secrets.HETZNER_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.HETZNER_DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.HETZNER_DEPLOY_PATH }}
          DEPLOY_RSYNC_PATH: sudo rsync
          DEPLOY_COMMIT_SHA: ${{ github.sha }}
          SMOKE_BASIC_AUTH_USER: ${{ secrets.SMOKE_BASIC_AUTH_USER }}
          SMOKE_BASIC_AUTH_PASSWORD: ${{ secrets.SMOKE_BASIC_AUTH_PASSWORD }}
        run: bash platform-infra/scripts/deploy-web-listener-hetzner.sh
