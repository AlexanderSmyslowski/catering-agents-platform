name: PR 685 export corrected workflow

on:
  push:
    branches:
      - codex/operator-readout-container-fix-20260903
    paths:
      - ".github/workflows/pr685-export-corrected.yml"

permissions:
  contents: write

concurrency:
  group: pr685-export-corrected
  cancel-in-progress: false

jobs:
  export:
    if: github.ref == 'refs/heads/codex/operator-readout-container-fix-20260903'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Reconstruct verified correction
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          from pathlib import Path

          source = Path('.github/workflows/pr685-one-shot-repair.yml').read_text()
          marker = "          cat >\"$patch_file\" <<'PATCH'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PATCH", start)
          raw = source[start:end]
          lines = []
          for line in raw.splitlines():
              if not line.startswith('          '):
                  raise SystemExit(f'unexpected patch indentation: {line!r}')
              lines.append(line[10:])
          Path('/tmp/pr685-readout.patch').write_text('\n'.join(lines) + '\n')
          PYTHON
          git apply --check /tmp/pr685-readout.patch
          git apply /tmp/pr685-readout.patch
          git diff --check

      - name: Verify corrected workflow
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          from pathlib import Path

          workflow = Path('.github/workflows/catering-production-operator-readout.yml').read_text()
          marker = "<<'REMOTE_READOUT'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          REMOTE_READOUT", start)
          Path('/tmp/pr685-remote-readout.sh').write_text(workflow[start:end] + "\n")
          PYTHON
          bash -n /tmp/pr685-remote-readout.sh
          npx vitest run tests/catering-production-operator-readout-contract.test.ts --maxWorkers=1
          npm run build

      - name: Export corrected blob through a non-workflow path
        run: |
          set -euo pipefail
          mkdir -p tmp
          cp .github/workflows/catering-production-operator-readout.yml tmp/pr685-corrected-readout.yml
          git restore -- .github/workflows/catering-production-operator-readout.yml
          test "$(git diff --name-only)" = ""
          test "$(git ls-files --others --exclude-standard)" = "tmp/pr685-corrected-readout.yml"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- tmp/pr685-corrected-readout.yml
          git commit -m "chore(infra): stage verified operator readout blob"
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
