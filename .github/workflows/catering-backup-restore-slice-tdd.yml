name: Catering backup/restore slice TDD

on:
  push:
    branches:
      - codex/catering-backup-restore-slice-20260903
    paths:
      - "platform-infra/backup/**"
      - "tests/catering-backup-restore-contract.test.ts"
      - "docs/operations/CATERING_BACKUP_RESTORE.md"
      - "docs/superpowers/plans/2026-09-03-catering-backup-restore-slice.md"
      - ".github/workflows/catering-backup-restore-slice-tdd.yml"

permissions:
  contents: read

concurrency:
  group: catering-backup-restore-slice-tdd
  cancel-in-progress: false

jobs:
  focused-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Focused backup/restore contract
        run: npx vitest run tests/catering-backup-restore-contract.test.ts --maxWorkers=1

      - name: Shell syntax
        if: success()
        run: |
          set -euo pipefail
          bash -n platform-infra/backup/catering-backup.sh
          bash -n platform-infra/backup/catering-restore-probe.sh
