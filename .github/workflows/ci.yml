name: CI

on:
  push:
    branches:
      - main
    tags:
      - "checkpoint-*"
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  browser-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install GNU screen
        run: |
          set -euo pipefail
          if ! command -v screen >/dev/null 2>&1; then
            ubuntu_sources=/etc/apt/sources.list.d/ubuntu.sources
            if [[ -f "$ubuntu_sources" ]] &&
               grep -q 'mirror+file:/etc/apt/apt-mirrors.txt' "$ubuntu_sources"; then
              sudo sed -i \
                's|mirror+file:/etc/apt/apt-mirrors.txt|https://archive.ubuntu.com/ubuntu|g' \
                "$ubuntu_sources"
            fi
            apt_options=(
              -o Acquire::Retries=3
              -o Acquire::http::Timeout=30
              -o Acquire::https::Timeout=30
            )
            sudo env DEBIAN_FRONTEND=noninteractive timeout 180s apt-get "${apt_options[@]}" update
            timeout 180s sudo apt-get install --no-install-recommends -y screen \
              "${apt_options[@]}"
          fi
          screen --version

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        env:
          npm_config_cache: ${{ runner.temp }}/catering-npm-cache
        run: npm ci

      - name: Install Playwright CLI and Chromium
        env:
          npm_config_cache: ${{ runner.temp }}/catering-npm-cache
        run: |
          npx --yes --package @playwright/cli playwright-cli install-browser chrome-for-testing
          chmod +x scripts/ci-browser-cli.sh
          echo "CATERING_BROWSER_CLI=$GITHUB_WORKSPACE/scripts/ci-browser-cli.sh" >> "$GITHUB_ENV"

      - name: Browser rehearsal
        env:
          npm_config_cache: ${{ runner.temp }}/catering-npm-cache
        run: timeout 300 npm run browser:rehearsal:full-fresh
