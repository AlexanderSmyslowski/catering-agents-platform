name: CI

on:
  push:
    branches:
      - main
    tags:
      - "checkpoint-*"
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  browser-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install GNU screen
        run: |
          # GitHub's Ubuntu runner may prefer azure.archive.ubuntu.com through
          # /etc/apt/apt-mirrors.txt. A stalled Azure mirror must not consume the
          # entire browser-rehearsal timeout before the actual test can start.
          if [[ -f /etc/apt/apt-mirrors.txt ]]; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          printf '%s\n' \
            'Acquire::Retries "2";' \
            'Acquire::http::Timeout "15";' \
            'Acquire::https::Timeout "15";' \
            | sudo tee /etc/apt/apt.conf.d/99-catering-ci-network >/dev/null
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y screen
          screen --version

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        env:
          npm_config_cache: ${{ runner.temp }}/catering-npm-cache
        run: npm ci

      - name: Install Playwright CLI and Chromium
        env:
          npm_config_cache: ${{ runner.temp }}/catering-npm-cache
        run: |
          npx --yes --package @playwright/cli playwright-cli install-browser chrome-for-testing
          chmod +x scripts/ci-browser-cli.sh
          echo "CATERING_BROWSER_CLI=$GITHUB_WORKSPACE/scripts/ci-browser-cli.sh" >> "$GITHUB_ENV"

      - name: Browser rehearsal
        env:
          npm_config_cache: ${{ runner.temp }}/catering-npm-cache
        run: timeout 300 npm run browser:rehearsal:full-fresh

  compose-render-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Fail-closed Compose JSON render and parity gate
        run: |
          set -euo pipefail
          command -v docker >/dev/null 2>&1 || { echo 'Docker Compose is required for the Phase 3 render gate.' >&2; exit 1; }
          compose_version="$(docker compose version --short | sed 's/^v//')"
          python3 - "$compose_version" "2.24.4" <<'PYTHON'
          import sys
          def version(value):
              parts = value.split(".")
              if len(parts) != 3 or not all(part.isdigit() for part in parts):
                  raise SystemExit("invalid Compose version")
              return tuple(int(part) for part in parts)
          if version(sys.argv[1]) < version(sys.argv[2]):
              raise SystemExit("Compose 2.24.4 or newer is required")
          PYTHON
          test -s platform-infra/docker-compose.phase3-catering-pilot.yml
          test -s edge-infra/docker-compose.phase3-catering-pilot.yml
          render_root="$(mktemp -d "${RUNNER_TEMP}/catering-compose-render.XXXXXX")"
          render_env="${render_root}/render.env"
          platform_render="${render_root}/platform.json"
          edge_render="${render_root}/edge.json"
          cleanup_render() {
            unlink "$render_env" 2>/dev/null || true
            unlink "$platform_render" 2>/dev/null || true
            unlink "$edge_render" 2>/dev/null || true
            rmdir "$render_root" 2>/dev/null || true
          }
          trap cleanup_render EXIT
          printf '%s\n' \
            'CATERING_TRUSTED_ACTOR_SECRET=ci-render-only' \
            'CATERING_BASIC_AUTH_USER=ci-render-only' \
            'CATERING_BASIC_AUTH_PASSWORD_HASH=ci-render-only' \
            'CADDY_EMAIL=ci-render-only@example.invalid' \
            'CATERING_INTAKE_SERVICE_URL=http://intake:3101' \
            > "$render_env"
          docker compose -p platform-infra --env-file "$render_env" \
            -f platform-infra/docker-compose.yml \
            -f platform-infra/docker-compose.production.yml \
            -f platform-infra/docker-compose.edge-cutover.yml \
            -f platform-infra/docker-compose.phase3-catering-pilot.yml \
            config --format json > "$platform_render"
          docker compose -p shared-edge --env-file "$render_env" \
            -f edge-infra/docker-compose.yml \
            -f edge-infra/docker-compose.phase3-catering-pilot.yml \
            config --format json > "$edge_render"
          test -s "$platform_render"
          test -s "$edge_render"
          python3 - "$platform_render" "$edge_render" <<'PYTHON'
          import json
          import sys

          platform = json.load(open(sys.argv[1], encoding="utf-8"))
          edge = json.load(open(sys.argv[2], encoding="utf-8"))
          if sorted(platform.get("services", {})) != ["exports", "intake", "offer", "postgres", "production", "web"]:
              raise SystemExit("unexpected rendered platform services")
          if sorted(edge.get("services", {})) != ["edge"]:
              raise SystemExit("unexpected rendered edge services")
          if sorted(platform.get("networks", {})) != ["catering_ingress", "catering_private"]:
              raise SystemExit("unexpected rendered platform networks")
          if "catering_ingress" not in edge.get("networks", {}):
              raise SystemExit("edge render lost catering_ingress")
          if "catering_private" in edge.get("networks", {}):
              raise SystemExit("edge render gained catering_private")
          for service in ["postgres", "intake", "offer", "production", "exports"]:
              if set(platform["services"][service].get("networks", {})) != {"catering_private"}:
                  raise SystemExit(f"private service parity failed for {service}")
          if set(platform["services"]["web"].get("networks", {})) != {"catering_ingress", "catering_private"}:
              raise SystemExit("web network parity failed")
          if set(edge["services"]["edge"].get("networks", {})) != {"catering_ingress", "platform-infra_default", "zeiterfassung_default"}:
              raise SystemExit("shared edge network parity failed")
          expected_platform_fields = {
              "postgres": {"restart", "environment", "volumes", "networks"},
              "intake": {"restart", "environment", "networks"},
              "offer": {"restart", "environment", "networks"},
              "production": {"restart", "environment", "networks"},
              "exports": {"restart", "environment", "networks"},
              "web": {"restart", "environment", "volumes", "networks"},
          }
          for service, fields in expected_platform_fields.items():
              actual = set(platform["services"][service])
              if not fields.issubset(actual):
                  raise SystemExit(f"platform runtime parity failed for {service}: missing {sorted(fields - actual)}")
          if platform["services"]["web"].get("ports") not in ([], None):
              raise SystemExit("platform web still owns public ports")
          expected_edge_fields = {"image", "restart", "ports", "environment", "volumes", "networks"}
          actual_edge = set(edge["services"]["edge"])
          if not expected_edge_fields.issubset(actual_edge):
              raise SystemExit(f"edge runtime parity failed: missing {sorted(expected_edge_fields - actual_edge)}")
          edge_ports = edge["services"]["edge"].get("ports")
          expected_edge_port_keys = {"mode", "target", "published", "protocol"}
          if not isinstance(edge_ports, list) or len(edge_ports) != 2:
              raise SystemExit("shared edge public port parity failed")
          edge_port_tuples = []
          for port in edge_ports:
              if not isinstance(port, dict) or set(port) != expected_edge_port_keys:
                  raise SystemExit("shared edge public port parity failed")
              if type(port["target"]) is not int or type(port["published"]) is not str:
                  raise SystemExit("shared edge public port parity failed")
              edge_port_tuples.append((port["mode"], port["target"], port["published"], port["protocol"]))
          if set(edge_port_tuples) != {("ingress", 80, "80", "tcp"), ("ingress", 443, "443", "tcp")}:
              raise SystemExit("shared edge public port parity failed")
          if edge["services"]["edge"]["environment"].get("EVENTOS_UPSTREAM") != "commcats-eventos-app:3045":
              raise SystemExit("EventOS upstream parity failed")
          if edge["services"]["edge"]["environment"].get("CATERING_UPSTREAM") != "http://web:8081":
              raise SystemExit("Catering upstream parity failed")
          for service in ["offer", "production"]:
              if platform["services"][service]["environment"].get("CATERING_INTAKE_SERVICE_URL") != "http://intake:3101":
                  raise SystemExit(f"intake service URL parity failed for {service}")
          PYTHON

  synthetic-backup-tool-integration:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.number > 0 &&
      github.event.pull_request.draft == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'codex/catering-target-hel1-20260919'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout exact synthetic test head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify hosted runner and source provenance before tool acquisition
        run: python3 -B tests/integration/catering_backup_tools.py --preflight
      - name: Acquire Restic through authenticated Ubuntu package metadata
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=0 update
          sudo apt-get -o Acquire::Retries=0 install --no-install-recommends -y restic
      - name: Check pure integration contracts
        run: |
          python3 -B tests/catering_backup_tool_integration_test.py
          python3 -B tests/catering_target_isolation_test.py
          python3 -B tests/catering_target_operations_test.py
      - name: Run synthetic component proof and targeted cleanup
        run: python3 -B tests/integration/catering_backup_tools.py
      - name: Run target operations Compose and Caddy proof
        run: python3 -B tests/integration/catering_target_operations.py

  catering-target-release-bundle:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'ops/catering-target-release-bundle-20260924'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      SOURCE_COMMIT: 5b2c77089e7fd9051b4a55e38240cd69d6e9ed99
    steps:
      - name: Checkout bundle tooling
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact product source
        uses: actions/checkout@v5
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          path: source
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact source binding
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_COMMIT"
          test -z "$(git -C source status --porcelain)"
          remote_main="$(git ls-remote origin refs/heads/main | awk 'NR == 1 {print $1}')"
          test "$remote_main" = "$SOURCE_COMMIT"

      - name: Build exact release bundle
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/catering-target-release-bundle"
          mkdir -p "$bundle/bin"
          docker build --iidfile "$bundle/runtime.iid" --tag "catering-target-runtime:$SOURCE_COMMIT" --file source/platform-infra/docker/Dockerfile.runtime source
          docker build --iidfile "$bundle/web.iid" --tag "catering-target-web:$SOURCE_COMMIT" --file source/platform-infra/docker/Dockerfile.web source
          if [[ -n "$(git -C source status --porcelain --untracked-files=all)" ]]; then
            printf '%s\n' 'CATERING_TARGET_RELEASE_SOURCE_DIRTY_AFTER_BUILD' >&2
            git -C source status --porcelain --untracked-files=all >&2
            exit 1
          fi
          runtime_image="$(cat "$bundle/runtime.iid")"
          web_image="$(cat "$bundle/web.iid")"
          [[ "$runtime_image" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$web_image" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker save "$runtime_image" | gzip -1 > "$bundle/runtime-image.tar.gz"
          docker save "$web_image" | gzip -1 > "$bundle/web-image.tar.gz"
          install -m 0755 platform-infra/scripts/catering-target-prebuilt-docker-adapter.sh "$bundle/bin/docker"
          python3 - "$bundle" "$SOURCE_COMMIT" "$runtime_image" "$web_image" <<'PY'
          import hashlib
          import json
          import pathlib
          import sys
          bundle = pathlib.Path(sys.argv[1])
          commit, runtime_image, web_image = sys.argv[2:]
          files = {}
          for name in ("runtime-image.tar.gz", "web-image.tar.gz"):
              files[name] = hashlib.sha256((bundle / name).read_bytes()).hexdigest()
          (bundle / "manifest.json").write_text(json.dumps({
              "schemaVersion": 1,
              "sourceCommit": commit,
              "runtimeImage": runtime_image,
              "webImage": web_image,
              "files": files,
          }, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
          manifest_sha="$(sha256sum "$bundle/manifest.json" | awk '{print $1}')"
          printf 'CATERING_TARGET_RELEASE_BUNDLE_OK source_commit=%s manifest_sha256=%s runtime_image=%s web_image=%s\n'             "$SOURCE_COMMIT" "$manifest_sha" "$runtime_image" "$web_image"

      - name: Verify adapter against exact source
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/catering-target-release-bundle"
          test_iid="$RUNNER_TEMP/runtime-adapter-check.iid"
          printf 'CATERING_TARGET_ADAPTER_PRECHECK root=%s head=%s\n' "$(git -C source rev-parse --show-toplevel)" "$(git -C source rev-parse HEAD)"
          git -C source status --porcelain --untracked-files=all
          (
            cd source
            CATERING_TARGET_PREBUILT_BUNDLE_DIR="$bundle" PATH="$bundle/bin:$PATH"               docker build --iidfile "$test_iid" --tag "catering-target-runtime:$SOURCE_COMMIT"               --file "$PWD/platform-infra/docker/Dockerfile.runtime" "$PWD"
          )
          test "$(cat "$test_iid")" = "$(cat "$bundle/runtime.iid")"
          CATERING_TARGET_PREBUILT_BUNDLE_DIR="$bundle" PATH="$bundle/bin:$PATH"             docker save "$(cat "$bundle/runtime.iid")" | sha256sum > "$RUNNER_TEMP/adapter-save.sha256"
          gzip -dc "$bundle/runtime-image.tar.gz" | sha256sum > "$RUNNER_TEMP/archive-save.sha256"
          cmp "$RUNNER_TEMP/adapter-save.sha256" "$RUNNER_TEMP/archive-save.sha256"

      - name: Upload exact release bundle
        uses: actions/upload-artifact@v4
        with:
          name: catering-target-release-bundle-5b2c77089e7fd9051b4a55e38240cd69d6e9ed99
          path: ${{ runner.temp }}/catering-target-release-bundle
          if-no-files-found: error
          retention-days: 7
