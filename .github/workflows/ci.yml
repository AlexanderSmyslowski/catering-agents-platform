name: CI

on:
  push:
    branches:
      - main
    tags:
      - "checkpoint-*"
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  browser-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install GNU screen
        run: |
          # GitHub's Ubuntu runner may prefer azure.archive.ubuntu.com through
          # /etc/apt/apt-mirrors.txt. A stalled Azure mirror must not consume the
          # entire browser-rehearsal timeout before the actual test can start.
          if [[ -f /etc/apt/apt-mirrors.txt ]]; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          printf '%s\n' \
            'Acquire::Retries "2";' \
            'Acquire::http::Timeout "15";' \
            'Acquire::https::Timeout "15";' \
            | sudo tee /etc/apt/apt.conf.d/99-catering-ci-network >/dev/null
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y screen
          screen --version

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        env:
          npm_config_cache: ${{ runner.temp }}/catering-npm-cache
        run: npm ci

      - name: Install Playwright CLI and Chromium
        env:
          npm_config_cache: ${{ runner.temp }}/catering-npm-cache
        run: |
          npx --yes --package @playwright/cli playwright-cli install-browser chrome-for-testing
          chmod +x scripts/ci-browser-cli.sh
          echo "CATERING_BROWSER_CLI=$GITHUB_WORKSPACE/scripts/ci-browser-cli.sh" >> "$GITHUB_ENV"

      - name: Browser rehearsal
        env:
          npm_config_cache: ${{ runner.temp }}/catering-npm-cache
        run: timeout 300 npm run browser:rehearsal:full-fresh
