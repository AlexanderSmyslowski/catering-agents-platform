name: PR 685 P2 export

on:
  push:
    branches:
      - codex/operator-readout-container-fix-20260903
    paths:
      - ".github/workflows/pr685-p2-export.yml"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false

      - name: Export bounded review fixture
        uses: actions/upload-artifact@v4
        with:
          name: pr685-p2-review-fixture-${{ github.sha }}
          retention-days: 1
          if-no-files-found: error
          path: |
            .github/workflows/catering-production-operator-readout.yml
            tests/catering-production-operator-readout-contract.test.ts
            shared-core/src/persistence.ts
            platform-infra/docker-compose.yml
            platform-infra/docker-compose.production.yml
            platform-infra/Dockerfile
            intake-service/Dockerfile
            offer-service/Dockerfile
            production-service/Dockerfile
            export-service/Dockerfile
