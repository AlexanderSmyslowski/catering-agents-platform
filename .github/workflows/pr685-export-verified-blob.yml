name: PR 685 export verified blob

on:
  push:
    branches:
      - codex/operator-readout-container-fix-20260903
    paths:
      - ".github/workflows/pr685-export-verified-blob.yml"

permissions:
  contents: write

concurrency:
  group: pr685-export-verified-blob
  cancel-in-progress: false

jobs:
  export:
    if: github.ref == 'refs/heads/codex/operator-readout-container-fix-20260903'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Decode and verify corrected workflow blob
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p tmp
          curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/346a90d9448961096316cf14e7b2c4b8a6afa905" \
            > "$RUNNER_TEMP/pr685-blob.json"
          python3 - <<'PYTHON'
          import base64
          import hashlib
          import json
          from pathlib import Path

          response = json.loads(Path('/home/runner/work/_temp/pr685-blob.json').read_text())
          encoded_payload = base64.b64decode(response['content']).decode('ascii')
          workflow = base64.b64decode(encoded_payload, validate=True)
          digest = hashlib.sha256(workflow).hexdigest()
          expected = 'b540337d2977e22314d5965bfe96e07244a78193260aec1a1d1f779ffd908af8'
          if digest != expected:
              raise SystemExit(f'unexpected corrected workflow digest: {digest}')
          Path('tmp/pr685-corrected-readout.yml').write_bytes(workflow)
          PYTHON
          test "$(sha256sum tmp/pr685-corrected-readout.yml | awk '{print $1}')" = \
            b540337d2977e22314d5965bfe96e07244a78193260aec1a1d1f779ffd908af8

      - name: Verify corrected workflow behavior
        run: |
          set -euo pipefail
          cp tmp/pr685-corrected-readout.yml .github/workflows/catering-production-operator-readout.yml
          python3 - <<'PYTHON'
          from pathlib import Path

          workflow = Path('.github/workflows/catering-production-operator-readout.yml').read_text()
          marker = "<<'REMOTE_READOUT'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          REMOTE_READOUT", start)
          Path('/tmp/pr685-remote-readout.sh').write_text(workflow[start:end] + "\n")
          PYTHON
          bash -n /tmp/pr685-remote-readout.sh
          npx vitest run tests/catering-production-operator-readout-contract.test.ts --maxWorkers=1
          npm run build
          git restore -- .github/workflows/catering-production-operator-readout.yml

      - name: Commit only the verified intermediate blob
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- tmp/pr685-corrected-readout.yml
          test "$(git diff --cached --name-only)" = "tmp/pr685-corrected-readout.yml"
          git commit -m "chore(infra): stage verified operator readout blob"
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
