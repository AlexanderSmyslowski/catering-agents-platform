name: Operator readout contract

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/catering-production-operator-readout.yml
      - .github/workflows/operator-readout-contract-red.yml
      - tests/catering-production-operator-readout-contract.test.ts

permissions:
  contents: read

jobs:
  focused-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Run focused contract
        run: npx vitest run tests/catering-production-operator-readout-contract.test.ts --maxWorkers=1
