name: Gate C bounded CI diagnosis
on:
  push:
    branches: [codex/gate-c-ci-diagnosis-20260920]
permissions:
  contents: read
jobs:
  reproduce-product-failures:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CATERING_LLM_PROVIDER: fixture
      CATERING_PRODUCTION_DRAFT_DATA_MODE: synthetic_or_demo_only
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 35a6926471b4985c6f3802c98407f5be2079bc2c
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Verify exact source and preserve inspection bundle
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 35a6926471b4985c6f3802c98407f5be2079bc2c
          test "$(git rev-parse HEAD^{tree})" = f2603dc3133899c3e89628ce1cb98602a90e44f2
          mkdir -p "$RUNNER_TEMP/gate-c-evidence"
          git archive --format=tar HEAD > "$RUNNER_TEMP/gate-c-evidence/source.tar"
          git cat-file commit HEAD > "$RUNNER_TEMP/gate-c-evidence/commit.txt"
          git ls-tree -rz HEAD > "$RUNNER_TEMP/gate-c-evidence/tree.bin"
          printf '%s\n' "$(node --version)" "$(npm --version)" > "$RUNNER_TEMP/gate-c-evidence/runtime.txt"
      - name: Install exact locked dependencies
        run: npm ci
      - name: Preserve installed dependencies for isolated offline product checks
        run: |
          set -euo pipefail
          # Only installed packages; no .git, npm credentials, caches or runtime data.
          find . -type d -name node_modules -prune -print0 | tar --null -T - -czf "$RUNNER_TEMP/gate-c-evidence/dependencies.tar.gz"
      - name: Read audit without updating packages
        run: |
          set +e
          npm audit --json > "$RUNNER_TEMP/gate-c-evidence/audit.json"
          echo "$?" > "$RUNNER_TEMP/gate-c-evidence/audit.exit"
          npm audit --omit=dev --json > "$RUNNER_TEMP/gate-c-evidence/audit-runtime.json"
          echo "$?" > "$RUNNER_TEMP/gate-c-evidence/audit-runtime.exit"
          exit 0
      - name: Reproduce only the seven failing product test files
        run: |
          set +e
          npm test -- tests/admin-api-access.test.ts tests/app-typed-route-boundary.test.ts tests/approved-production-spec.test.ts tests/critical-path-rehearsal.test.ts tests/platform.test.ts tests/product-shell-data-boundary.test.tsx tests/production-case-routes.test.ts --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/gate-c-evidence/product-red.json" > "$RUNNER_TEMP/gate-c-evidence/product-red.log" 2>&1
          status=$?
          echo "$status" > "$RUNNER_TEMP/gate-c-evidence/product-red.exit"
          tail -n 80 "$RUNNER_TEMP/gate-c-evidence/product-red.log"
          exit 0
      - name: Bind evidence files
        if: always()
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/gate-c-evidence"
          sha256sum -- * > SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-c-ci-diagnosis-source-35a6926
          path: ${{ runner.temp }}/gate-c-evidence
          retention-days: 7
          if-no-files-found: error
